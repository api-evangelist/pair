name: Pair
description: Pair (formerly Inversity) is an enterprise AI adoption platform that helps
  organizations build workforce capability in artificial intelligence and measure the
  return on their AI investment. Pair delivers personalized, hands-on masterclasses
  grounded in each learner's role, industry, and day-to-day tasks — covering tools
  such as ChatGPT, Microsoft Copilot, and Claude, plus agentic AI — moving teams from
  basic AI awareness to measurable adoption. A multi-tier certification path
  (Fundamentals, Proficiency, Mastery), team adoption dashboards, ROI measurement that
  tracks time saved and business impact, an AI Showcase for sharing effective workflows,
  and manager oversight tools round out the platform. Pair is a Seedcamp portfolio company.
